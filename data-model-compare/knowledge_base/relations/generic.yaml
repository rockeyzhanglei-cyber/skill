# 医疗行业通用表关联模式
#
# 本文件描述从实际源标准中验证过的通用关联模式。
# 每条模式都至少在一个实际源标准中存在。
#
# 注意：本文件只描述模式，不包含具体字段名。
# SQL精度的 JOIN 条件在各 source_xxx.yaml 文件中定义。
#
# 验证来源：
# - 云南区域卫生信息平台数据传输规范 v5.5（source_standard.json）

# ===== 验证过的通用模式 =====
# 以下模式在云南v5.5中验证存在，预计在其他医疗标准中也通用

patterns:

  # 模式1：就诊流水号枢纽
  # 核心表通过就诊流水号关联同一次就诊的所有子表
  visit_hub:
    description: "就诊记录表作为枢纽，通过就诊流水号+机构代码关联所有同次就诊的表"
    hub_tables: [门诊就诊记录表, 住院就诊记录表]
    typical_related: [挂号表, 收费表, 医嘱表, 诊断表, 检验表, 检查表]

  # 模式2：卡号关联患者
  # 业务表通过卡号+卡类型关联患者基本信息表
  patient_card:
    description: "业务表通过卡号+卡类型关联患者基本信息"
    join_keys: [卡号, 卡类型]
    target: 患者信息表

  # 模式3：收费主表→明细
  # 收费记录表通过收费流水号+发票号关联收费明细表
  billing_detail:
    description: "收费记录表通过收费流水号+发票号关联收费明细表"
    hub_tables: [门诊收费记录表, 住院收费记录表]
    detail_tables: [门诊收费明细表, 住院收费明细表]

  # 模式4：检验主表→子表链
  # 检验记录→检验明细→细菌结果→药敏结果
  lab_chain:
    description: "检验记录→检验明细→细菌结果→药敏结果 链式关联"
    chain: [检验记录表, 检验明细表, 细菌结果表, 药敏结果表]

  # 模式5：字典表被引用
  # 药品信息表/收费项目表通过代码被医嘱表/收费明细表引用
  dictionary_ref:
    description: "字典表通过代码字段被业务表引用，提供名称查询"
    dictionaries:
      药品信息表: { referenced_by: [门诊药品医嘱表, 住院药品医嘱表] }
      收费项目信息表: { referenced_by: [门诊收费明细表, 住院收费明细表] }
