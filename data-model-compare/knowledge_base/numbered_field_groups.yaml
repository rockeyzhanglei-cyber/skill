# 序号字段组配置（主子表展开策略 —— 通用自动检测）
#
# 本配置不再硬编码任何「目标表名 / 源子表名 / 正则 pattern」，
# 因为那样只能适配当前这一套标准，换一套标准就失效。
#
# 通用规律（由代码自动处理，见 matchers/standard_comparator.py
#           _detect_numbered_field_groups 及其辅助方法）：
#   目标标准把原标准的"主子表"展开成多列序号字段
#   （如 出院西医其他诊断疾病代码1..N / 其他手术操作代码1..N），
#   原标准用「主表 + 子表（一行一记录）」存储。
#   代码会自动：
#     1. 检测目标表中带数字后缀的序号字段；
#     2. 按基础名聚类；
#     3. 从对齐源主表的候选子表（中文名前缀兄弟 / 英文名族前缀 / P6 外键邻接）
#        中选出域概念最匹配的子表；
#     4. 命中子表 → 整组标注「主子表映射」，归属该子表；
#     5. 找不到匹配子表 → 序号字段保持为普通字段，由常规通道处理。
#
# 这里只保留通用阈值参数，任何标准都可复用。

min_group_size: 2          # 同一基础名至少出现 N 次（含序号）才视为「序号字段组」

min_domain_overlap: 1      # 候选子表中至少有 N 个字段的域概念与序号组重叠（>=2 字公共子串）才认定匹配

# 字段角色尾词：从基础名中剥离以提取「域概念」。
# 例：出院西医其他诊断疾病代码 →(剥代码)→ 出院西医其他诊断疾病（域概念=诊断）
#     其他手术操作Ⅰ助 →(剥Ⅰ助)→ 其他手术操作（域概念=手术）
# 按长度降序排列，避免被短尾词提前截断。
field_role_tails:
  - "Ⅰ助"
  - "Ⅱ助"
  - "一助"
  - "二助"
  - "三助"
  - "唯一标识"
  - "流水号"
  - "序号"
  - "编号"
  - "标识"
  - "标志"
  - "持续时间"
  - "日期时间"
  - "日期"
  - "时间"
  - "麻醉方式"
  - "麻醉医师"
  - "麻醉分级"
  - "切口愈合等级"
  - "切口类别"
  - "愈合等级"
  - "助"
  - "级别"
  - "等级"
  - "类别"
  - "类型"
  - "医师"
  - "名称"
  - "姓名"
  - "编码"
  - "代码"
  - "号"
