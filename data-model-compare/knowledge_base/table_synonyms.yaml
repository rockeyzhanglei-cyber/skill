# ===== 多对一表映射 =====
# 一个目标表对应多个源表的场景（汇总表、视图等）
# sources 按优先级排列，优先从排在前面的源表取字段
multi_source_tables:
  门诊/住院摘要:
    aliases: [m_event_info, "门诊/住院摘要(m_event_info)"]
    sources:
      - "门诊就诊记录表 MZJZJLB"
      - "住院就诊记录表 ZYJZJLB"
      - "卫生事件摘要 WSSJZY"
    description: "门诊/住院摘要是门诊和住院的汇总信息，优先从MZJZJLB和ZYJZJLB取值，WSSJZY作为补充"
  输血记录-诊断:
    aliases: [m_emr_blood_diag, "输血记录-诊断(m_emr_blood_diag)"]
    sources:
      - "输血记录 BLD_TRAN_RECORD"
    description: "云南源标准把主要诊断内联在输血记录表中，输血记录-诊断子表的诊断字段从输血记录主表取"
