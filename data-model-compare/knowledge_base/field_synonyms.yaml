  # ===== 系统审计时间字段（人工确认同义，V6.0医疗服务 vs 省平台v1.4.1医疗部分）=====
  # 目标省平台 m_patient 将系统级审计字段拍平到主表；源标准 PERSON 等主表以
  # SYS_CREATED_AT(创建日期时间) / SYS_MODIFIED_AT(修改日期时间) 表达同一含义。
  # 业务侧"业务数据产生/更新日期时间" == 源侧"创建/修改日期时间"，人工确认是同一个意思，
  # 故显式登记为同义，跳过核心概念闸门（"产生/创建"核心词不同会误拒）。
  # 匹配应落在主表 PERSON，而非地址子表 PERSON_ADDRESS 的 SYS_ 字段。
  业务数据产生日期时间:
    synonyms: [创建日期时间, 数据创建时间]
    description: "人工确认同义：目标省平台 m_patient.业务数据产生日期时间 = 源标准 PERSON.SYS_CREATED_AT(创建日期时间)，主表级审计字段"
  业务数据更新日期时间:
    synonyms: [修改日期时间, 数据修改时间]
    description: "人工确认同义：目标省平台 m_patient.业务数据更新日期时间 = 源标准 PERSON.SYS_MODIFIED_AT(修改日期时间)，主表级审计字段"
  创建日期时间:
    synonyms: [业务数据产生日期时间, 数据创建时间]
    description: "人工确认同义（反向）：源标准 PERSON.SYS_CREATED_AT(创建日期时间) = 目标省平台 m_patient.业务数据产生日期时间"
  修改日期时间:
    synonyms: [业务数据更新日期时间, 数据修改时间]
    description: "人工确认同义（反向）：源标准 PERSON.SYS_MODIFIED_AT(修改日期时间) = 目标省平台 m_patient.业务数据更新日期时间"
