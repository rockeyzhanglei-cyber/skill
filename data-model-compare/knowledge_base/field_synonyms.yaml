# 字段同义词库（统一版）
# 合并了原 synonyms.yaml 和 industry/industry_base_synonyms.yaml
# 格式：关键词 -> { synonyms: [...], standard_codes: [...](可选), description: "..."(可选) }
#
# 代码加载时只读取 synonyms 字段，standard_codes 和 description 供人工维护参考

field_synonyms:

  # ===== 患者标识 =====
  个人基本信息标识号:
    # 目标省平台"个人基本信息标识号"= 注册机构患者唯一索引，即源标准患者主键。
    # 实测（V6.0 医疗服务 vs 省平台v1.4.1）：应匹配 患者唯一标识(PERSON.PERSON_ID)
    # 或各业务表外键 患者标识(PERSON_ID)。此前混入 病案号/档案号/住院号 会在
    # 同义层按字段序优先命中病案号（错误）；已移除，只保留患者标识族。
    synonyms: [local_id, YYDAH, 患者ID, 患者标识, 患者唯一标识, patient_id]
  患者:
    synonyms: [病人, 病患, 人员]
  病人:
    synonyms: [患者, 病患]
  档案号:
    synonyms: [病案号, 住院号, 门诊号, 就诊号, YYDAH, local_id, patient_id, 患者ID]
    standard_codes: [YYDAH]
    description: "患者在医疗机构的唯一标识"
  病案号:
    synonyms: [档案号, 住院号, YYDAH]
  住院号:
    synonyms: [档案号, 病案号, 入院号]
  门诊号:
    synonyms: [档案号, 就诊号]

  # ===== 姓名 =====
  姓名:
    # 注意：名称 不应作为姓名的同义词——名称泛指实体名（院区名称/诊断名称/药品名称），
    # 姓名特指个人姓名，两者概念不同。移除"名称"可避免所有含"名称"的字段误配到 FULL_NAME。
    synonyms: [名字, 患者姓名, 病人姓名, patient_name, name]
    standard_codes: [XM]
    description: "患者姓名"
  患者姓名:
    synonyms: [姓名, 名字, patient_name]

